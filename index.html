<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
    }

    .container {
      padding: 10px;
      overflow-x: auto;
      /* ★ 横スクロールを許可 (スマホ対応) */
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
      /* ★ 列が潰れないように */
      font-size: 14px;
      background: white;
    }

    th,
    td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
      /* ★ 折り返さない（見やすさUP） */
    }

    th {
      position: sticky;
      /* ★ ヘッダー固定 */
      top: 0;
      background: #fafafa;
      font-weight: bold;
      border-bottom: 2px solid #ccc;
      z-index: 10;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    /* スマホでフォント大きめ */
    @media (max-width: 500px) {
      table {
        font-size: 16px;
      }

      th,
      td {
        padding: 10px 14px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <table>
      <? for (let r = 0; r < values.length; r++) { ?>
      <tr>
        <? for (let c = 0; c < values[r].length; c++) { ?>
        <td style="
                background: <?= bg[r][c] ?>;
                color: <?= fc[r][c] ?>;
              ">
          <?= values[r][c] ?>
        </td>
        <? } ?>
      </tr>
      <? } ?>
    </table>
  </div>
</body>

</html>
